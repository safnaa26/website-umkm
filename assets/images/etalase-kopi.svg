<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Etalase Kopi Ku</title>
  <desc id="desc">Ilustrasi dua kemasan kopi di atas meja kayu.</desc>

  <!-- Background -->
  <rect width="640" height="360" fill="#fef3c7" />

  <!-- Meja kayu -->
  <rect y="260" width="640" height="100" fill="#8d5a3b" />

  <!-- Dua kemasan kopi -->
  <g fill="#6f3b1f">
    <rect x="180" y="90" width="110" height="180" rx="12" />
    <rect x="350" y="70" width="110" height="200" rx="12" />
  </g>

  <!-- Nama produk -->
  <g fill="#ffd166" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <text x="235" y="185">Coffe Latte</text>
    <text x="405" y="175">Americano</text>
  </g>
</svg>