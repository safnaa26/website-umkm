        <h2 id="media-title">Media Usaha</h2>

          <figure class="media-card">
            <img src="assets/images/exterior.jpg" alt="Tampak depan kedai Kopi Ku dengan pencahayaan hangat" loading="lazy" />
            <figcaption>Tampilan depan kedai yang hangat dan mengundang pelanggan untuk singgah.</figcaption>
          </figure>
          <figure class="media-card">
            <img src="assets/images/interior.jpg" alt="Ruang duduk interior Kopi Ku dengan meja kayu dan lampu gantung" loading="lazy" />
            <figcaption>Ruang duduk yang nyaman untuk bersantai sambil menikmati kopi.</figcaption>

          <figure class="media-card">
            <img src="assets/images/etalase menu.jpg" alt="Etalase menu Kopi Ku menampilkan pilihan biji kopi dan harga" loading="lazy" />
            <figcaption>Etalase menu membantu pelanggan memilih biji kopi sesuai selera.</figcaption>
          </figure>
          <figure class="media-card">
            <img src="assets/images/proses seduh.jpg" alt="Proses penggilingan biji kopi menggunakan mesin grinder" loading="lazy" />

          </figure>
          <figure class="media-card">
            <img src="assets/images/kemasan take away.jpg" alt="Gelas kemasan take away Kopi Ku" loading="lazy" />

            <figcaption>Setiap pesanan diracik langsung agar kualitas rasa tetap terjaga.</figcaption>
